<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d1c4b1; /* Tan background color */
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #3e2723; /* Dark brown for heading */
        }

        .statistics {
            text-align: left;
            margin-top: 20px;
        }

        .statistics h3 {
            color: #3e2723; /* Dark brown for subheadings */
        }

        .statistics p {
            color: #5d4037; /* Dark brown for text */
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #3e2723; /* Dark brown button */
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }

        .button:hover {
            background-color: #4e342e; /* Slightly lighter brown on hover */
        }
        a {
            display: block;
            text-align: center;
            margin-top: 30px;
            font-size: 18px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: #3e2723; /* Dark brown for button */
            border-radius: 5px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
            transition: background 0.3s ease;
        }

        a:hover {
            background: #4e342e; /* Slightly lighter brown on hover */
        }
        nav {
            background-color: #3e2723; /* Dark background for nav */
            padding: 10px 0;
            text-align: center;
            display: flex; /* Use Flexbox for horizontal alignment */
            justify-content: center; /* Center the links horizontally */
            align-items: center; /* Center the links vertically */
        }

        nav a {
            color: white;
            margin: 0 20px; /* Add spacing between links */
            text-decoration: none;
            font-weight: bold;
            display: inline-block; /* Make links inline-block */
            padding: 10px 15px; /* Add padding for better clickability */
            transition: background 0.3s ease; /* Smooth hover effect */
        }

        nav a:hover {
            background: #4e342e; /* Slightly lighter brown on hover */
        }
        /* Add to your existing styles */
        nav a, .dropbtn {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 15px;
            transition: background 0.3s ease;
        }

        nav a:hover, .dropdown:hover .dropbtn {
            background: #4e342e;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            padding: 10px 15px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #4e342e;
            color: white;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background: #4e342e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Report Results</h1>

        <div class="statistics">
            <h3>Total Revenue: ${{ total_revenue }}</h3>
            <h3>Average Order Value: ${{ average_order_value }}</h3>
            <h3>Number of Orders: {{ num_orders }}</h3>
            <h3>Most Popular Item: {{ most_popular_item.name if most_popular_item else "N/A" }}</h3>
        </div>

        <a href="{{ url_for('generate_report') }}">Generate Another Report</a>
        <a href="{{ url_for('home') }}">Return to Home</a>
    </div>
</body>
</html>
