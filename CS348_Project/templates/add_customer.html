<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Customer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d1c4b1; /* Tan background color */
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #3e2723; /* Dark brown for heading */
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #3e2723; /* Dark brown for labels */
        }

        .form-group input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            width: 100%;
            max-width: 300px;
        }

        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #3e2723; /* Dark brown button */
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .button:hover {
            background-color: #4e342e; /* Slightly lighter brown on hover */
        }

        .customer-details {
            margin-top: 20px;
            text-align: left;
        }

        .customer-details h3 {
            color: #3e2723; /* Dark brown for subheadings */
        }

        .customer-details p {
            color: #5d4037; /* Dark brown for text */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Register Customer</h1>

        <form method="POST" action="/register_customer">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <button class="button" type="submit">Register</button>
        </form>

        {% if customer %}
        <div class="customer-details">
            <h3>Registration Successful!</h3>
            <p><strong>Customer ID:</strong> {{ customer.customer_id }}</p>
            <p><strong>Name:</strong> {{ customer.name }}</p>
            <p><strong>Email:</strong> {{ customer.email }}</p>
            <p><strong>Phone:</strong> {{ customer.phone }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
